# Builds the site as a container image and pushes it to the GitHub container
# registry: ghcr.io/kidoly/monitorflow-website, tagged with the commit SHA and
# "main". Runs on every push to main and by hand (Actions > Image > Run
# workflow). Only the built-in GITHUB_TOKEN is used.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SITE_URL   https://monitorflow.eu, or https://monitorflow.net until .eu exists
#   DEMO_URL   optional: the demo's own address; empty serves it from the site at /demo/
#   VIDEO_URL  optional, where the promo video is served from once it is final

name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kidoly/monitorflow-website
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_DEMO_URL=${{ vars.DEMO_URL }}
            NEXT_PUBLIC_VIDEO_URL=${{ vars.VIDEO_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
