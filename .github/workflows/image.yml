# Builds the site as a container image and pushes it to the GitHub container
# registry: ghcr.io/kidoly/monitorflow-website, tagged with the commit SHA and
# "main". Runs on every push to main, every night (so new guides, a new demo
# and a new release number reach the image without a change here), and by
# hand (Actions > Image > Run workflow). A night with nothing new in the
# product reuses every cached layer. Only the built-in GITHUB_TOKEN is used.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SITE_URL   https://monitorflow.eu, or https://monitorflow.net until .eu exists
#   DEMO_URL   optional: the demo's own address; empty serves it from the site at /demo/
#   VIDEO_URL  optional, where the promo video is served from once it is final

name: Image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: product
        name: Find the product's current commit and release
        run: |
          echo "commit=$(git ls-remote https://github.com/Kidoly/monitorflow.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "release=$(git ls-remote --tags --refs https://github.com/Kidoly/monitorflow.git 'v*' | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kidoly/monitorflow-website
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_DEMO_URL=${{ vars.DEMO_URL }}
            NEXT_PUBLIC_VIDEO_URL=${{ vars.VIDEO_URL }}
            MF_PRODUCT_COMMIT=${{ steps.product.outputs.commit }}-${{ steps.product.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
