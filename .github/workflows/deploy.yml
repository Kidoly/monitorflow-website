# Publishes the site to GitHub Pages, every night (so new guides, a new
# demo and a new release number go live without a change here) and by hand.
# Nothing is published until the owner turns hosting on (Settings > Pages >
# Source: GitHub Actions): until then the nightly run finds Pages off and
# stops without building.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   SITE_URL   https://monitorflow.eu, or https://monitorflow.net until .eu exists
#   DEMO_URL   optional: the demo's own address; empty serves it from the site at /demo/
#   VIDEO_URL  optional, where the promo video is served from once it is final
#              (a release asset, for example); empty serves /media/promo/ from the site

name: Deploy site

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-on:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.check.outputs.on }}
    steps:
      - id: check
        name: Is GitHub Pages turned on?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type >/dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off (Settings > Pages): nothing published."
          fi

  build:
    needs: pages-on
    if: ${{ needs.pages-on.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_DEMO_URL: ${{ vars.DEMO_URL }}
      NEXT_PUBLIC_VIDEO_URL: ${{ vars.VIDEO_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run guides
      - run: npm run build
      - name: Custom domain
        if: ${{ vars.SITE_URL != '' }}
        run: echo "${SITE_URL#https://}" | sed 's#/.*##' > out/CNAME
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
