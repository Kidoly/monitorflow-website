# The site's server block, installed as /etc/nginx/conf.d/default.conf in the
# image (inside the http block of the image's nginx.conf). It serves the static
# export in /usr/share/nginx/html on port 8080, as an unprivileged user.

# Hashed build assets never change: cache them for a year. Pages and the
# route payloads (index.txt) change with every build: revalidate each time.
map $uri $mf_cache_control {
    ~^/(demo/)?_next/static/   "public, max-age=31536000, immutable";
    ~(\.html|\.txt|/)$         "no-cache";
    default                    "public, max-age=3600";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects keep the scheme and host the visitor used (a proxy in front
    # terminates TLS): "Location: /pricing/", not "http://host:8080/pricing/".
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/vtt application/javascript
               application/json application/xml application/rss+xml image/svg+xml;

    # Every response, errors included. These are the only add_header lines:
    # nginx drops inherited add_header as soon as a location sets its own.
    add_header Cache-Control $mf_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Next.js inlines each page's route payload and the theme script as
    # <script> blocks, and React sets style attributes, so scripts and styles
    # allow 'unsafe-inline'. Everything else comes from the site itself.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
    }

    location ^~ /demo/_next/static/ {
        try_files $uri =404;
    }

    location ~ \.vtt$ {
        types { }
        default_type text/vtt;
        try_files $uri =404;
    }

    # No trailing slash: a file, or a page directory that gets its slash.
    location ~ [^/]$ {
        try_files $uri @with_slash;
    }

    location @with_slash {
        if (-f $request_filename/index.html) {
            return 301 $uri/$is_args$args;
        }
        return 404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
